<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Affinity Mapping</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);color:#e0e0e0;min-height:100vh}.container{max-width:1400px;margin:0 auto;padding:20px}header{text-align:center;padding:40px}h1{font-size:2.5em;color:#00d4ff}.viz{background:rgba(0,0,0,0.4);border-radius:20px;height:450px;position:relative;overflow:hidden;margin-top:20px}.node{position:absolute;padding:10px 16px;border-radius:20px;cursor:pointer;transition:all 0.3s;font-size:0.85em}.node:hover{transform:scale(1.15);z-index:10}.node.v{background:linear-gradient(135deg,#50c878,#2d8659)}.node.s{background:linear-gradient(135deg,#48dbfb,#0abde3)}.node.w{background:linear-gradient(135deg,#ff6b6b,#ee5a5a}.node.l{background:linear-gradient(135deg,#feca57,#ff9f43}.legend{display:flex;gap:20px;justify-content:center;margin-top:20px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:8px}.dot{width:16px;height:16px;border-radius:50%}.controls{display:flex;gap:12px;justify-content:center;margin-top:20px}.btn{background:#00d4ff;border:none;color:#0a0a0f;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:600}</style></head><body><div class="container"><header><h1>🔗 Affinity Mapping Engine</h1><p>Values, Skills, Wounds, Longings as Living Constellations</p></header><div class="viz" id="viz"></div><div class="legend"><div class="legend-item"><div class="dot" style="background:#50c878"></div>Values</div><div class="legend-item"><div class="dot" style="background:#48dbfb"></div>Skills</div><div class="legend-item"><div class="dot" style="background:#ff6b6b"></div>Wounds</div><div class="legend-item"><div class="dot" style="background:#feca57"></div>Longings</div></div><div class="controls"><button class="btn" onclick="gen()">✨ Generate</button><button class="btn" onclick="attract()">🌊 Attract</button><button class="btn" onclick="reset()">🔄 Reset</button></div></div><script>const viz=document.getElementById('viz');const data={v:['Generosity','Integrity','Compassion','Justice'],s:['Systems Thinking','Active Listening','Conflict Resolution'],w:['Abandonment','Betrayal','Rejection'],l:['Belonging','Purpose','Impact']};let ns=[];function gen(){viz.querySelectorAll('.node').forEach(n=>n.remove());ns=[];let i=0;for(const[t,it]of Object.entries(data)){it.forEach(item=>{const angle=(i/16)*Math.PI*2;const r=100+Math.random()*100;const x=viz.offsetWidth/2+Math.cos(angle)*r;const y=viz.offsetHeight/2+Math.sin(angle)*r;const el=document.createElement('div');el.className='node '+t;el.textContent=item;el.style.left=x+'px';el.style.top=y+'px';viz.appendChild(el);ns.push({el,x,y});i++})}};function attract(){const c={x:viz.offsetWidth/2,y:viz.offsetHeight/2};ns.forEach(n=>{n.x+=(c.x-n.x)*0.05;n.y+=(c.y-n.y)*0.05;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'})};function reset(){gen()};gen()</script></body></html>
