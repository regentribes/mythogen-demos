<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Sphere</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; color: #888; }
        #info h1 { color: #00d4ff; font-size: 1.2em; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="info"><h1>Fibonacci Sphere</h1><p>Golden angle distribution</p></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const phi = (1 + Math.sqrt(5)) / 2;
        const points = [];
        const count = 200;
        
        for (let i = 0; i < count; i++) {
            const theta = 2 * Math.PI * i / phi;
            const phi2 = Math.acos(1 - 2 * (i + 0.5) / count);
            points.push(new THREE.Vector3(
                Math.sin(phi2) * Math.cos(theta) * 10,
                Math.sin(phi2) * Math.sin(theta) * 10,
                Math.cos(phi2) * 10
            ));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.PointsMaterial({ color: 0x00d4ff, size: 0.5, transparent: true, opacity: 0.8 });
        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);

        const wireGeometry = new THREE.SphereGeometry(10, 32, 32);
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true, transparent: true, opacity: 0.3 });
        scene.add(new THREE.Mesh(wireGeometry, wireMaterial));

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.002;
            sphere.rotation.x += 0.001;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
