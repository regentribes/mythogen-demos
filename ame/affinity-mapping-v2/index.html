<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Affinity Mapping v2 — Alien.js</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono">
    <link rel="stylesheet" href="../assets/css/style.css">

    <script type="module">
        import { Color, ColorManagement, Group, HemisphereLight, IcosahedronGeometry, LinearSRGBColorSpace, MathUtils, Mesh, MeshBasicMaterial, OctahedronGeometry, PerspectiveCamera, Points, PointsMaterial, Scene, SphereGeometry, Vector3, WebGLRenderer, ticker } from '../build/alien.three.js';

        class AffinityNode extends Group {
            constructor(color, type, label) {
                super();
                this.type = type;
                this.label = label;
                
                const geo = type === 'value' ? new OctahedronGeometry(0.5, 0) : 
                           type === 'skill' ? new IcosahedronGeometry(0.4, 0) :
                           new SphereGeometry(0.35, 16, 16);
                
                const mat = new MeshBasicMaterial({ 
                    color: new Color(color),
                    transparent: true,
                    opacity: 0.9
                });
                this.mesh = new Mesh(geo, mat);
                this.add(this.mesh);
                
                this.targetPos = new Vector3();
                this.currentPos = new Vector3();
            }
            
            setTarget(x, y, z) {
                this.targetPos.set(x, y, z);
            }
            
            update(time) {
                // Smooth movement toward target
                this.currentPos.lerp(this.targetPos, 0.02);
                this.position.copy(this.currentPos);
                
                // Gentle rotation
                this.mesh.rotation.y += 0.01;
                this.mesh.rotation.x += 0.005;
                
                // Pulse
                const pulse = Math.sin(time * 2 + this.currentPos.x) * 0.1 + 1;
                this.mesh.scale.setScalar(pulse);
            }
        }

        class AffinityConstellation extends Group {
            constructor() {
                super();
            }

            async initMesh() {
                this.nodes = [];
                
                // Values (green) - center cluster
                const values = ['Generosity', 'Integrity', 'Compassion', 'Justice'];
                values.forEach((v, i) => {
                    const angle = (i / values.length) * Math.PI * 2;
                    const node = new AffinityNode(0x50c878, 'value', v);
                    node.setTarget(Math.cos(angle) * 3, Math.sin(angle) * 3, 0);
                    this.add(node);
                    this.nodes.push(node);
                });
                
                // Skills (blue) - middle ring
                const skills = ['Systems Thinking', 'Listening', 'Conflict Resolution'];
                skills.forEach((s, i) => {
                    const angle = (i / skills.length) * Math.PI * 2 + 0.5;
                    const node = new AffinityNode(0x48dbfb, 'skill', s);
                    node.setTarget(Math.cos(angle) * 6, Math.sin(angle) * 6, (i - 1) * 0.5);
                    this.add(node);
                    this.nodes.push(node);
                });
                
                // Wounds (red) - outer ring
                const wounds = ['Abandonment', 'Betrayal'];
                wounds.forEach((w, i) => {
                    const angle = Math.PI * (i + 1);
                    const node = new AffinityNode(0xff6b6b, 'wound', w);
                    node.setTarget(Math.cos(angle) * 9, Math.sin(angle) * 6, 1);
                    this.add(node);
                    this.nodes.push(node);
                });
                
                // Longings (yellow) - outer ring
                const longings = ['Belonging', 'Purpose'];
                longings.forEach((l, i) => {
                    const angle = Math.PI * (i + 0.5);
                    const node = new AffinityNode(0xfeca57, 'longing', l);
                    node.setTarget(Math.cos(angle) * 8, Math.sin(angle) * 8, -1);
                    this.add(node);
                    this.nodes.push(node);
                });
                
                // Create connection lines as points
                const linePoints = [];
                for (let i = 0; i < 20; i++) {
                    linePoints.push(new Vector3(
                        (Math.random() - 0.5) * 16,
                        (Math.random() - 0.5) * 16,
                        (Math.random() - 0.5) * 4
                    ));
                }
                const lineGeo = new BufferGeometry().setFromPoints(linePoints);
                const lineMat = new PointsMaterial({ color: 0x333333, transparent: true, opacity: 0.5 });
                this.lines = new Points(lineGeo, lineMat);
                this.add(this.lines);
            }

            update(time) {
                this.nodes.forEach(node => node.update(time));
                this.lines.rotation.y += 0.001;
            }
            
            attract() {
                // Pull all nodes toward center
                this.nodes.forEach(node => {
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * 4;
                    node.setTarget(Math.cos(angle) * r, Math.sin(angle) * r, 0);
                });
            }
            
            scatter() {
                // Push nodes outward
                this.nodes.forEach(node => {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 5 + Math.random() * 6;
                    node.setTarget(Math.cos(angle) * r, Math.sin(angle) * r, (Math.random() - 0.5) * 2);
                });
            }
        }

        class WorldController {
            static async init() {
                ColorManagement.enabled = true;
                ColorManagement.outputColorSpace = LinearSRGBColorSpace;

                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(this.renderer.domElement);

                await this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            static async resize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        WorldController.renderer = new WebGLRenderer({ antialias: true });
        WorldController.camera = new PerspectiveCamera(50, 1, 0.1, 100);
        WorldController.camera.position.z = 20;

        WorldController.scene = new Scene();
        WorldController.scene.background = new Color(0x0a0a0f);

        const ambient = new HemisphereLight(0xffffff, 0x444444, 1);
        WorldController.scene.add(ambient);

        await WorldController.init();

        const constellation = new AffinityConstellation();
        WorldController.scene.add(constellation);
        await constellation.initMesh();

        let time = 0;
        let attractMode = true;
        
        // Toggle between attract and scatter
        setInterval(() => {
            if (attractMode) {
                constellation.scatter();
            } else {
                constellation.attract();
            }
            attractMode = !attractMode;
        }, 3000);
        
        ticker.add(() => {
            time += 0.016;
            constellation.update(time);
            constellation.rotation.y += 0.002;
            
            WorldController.renderer.render(WorldController.scene, WorldController.camera);
        });
    </script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; }
        #legend { position: absolute; top: 20px; left: 20px; color: #fff; font-family: 'Roboto Mono', monospace; font-size: 11px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; }
        #legend h1 { color: #00d4ff; margin: 0 0 12px 0; font-size: 14px; }
        .item { display: flex; align-items: center; margin: 5px 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .values { background: #50c878; }
        .skills { background: #48dbfb; }
        .wounds { background: #ff6b6b; }
        .longings { background: #feca57; }
        .note { color: #888; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="legend">
        <h1>🔗 Affinity Mapping</h1>
        <div class="item"><div class="dot values"></div>Values (relational)</div>
        <div class="item"><div class="dot skills"></div>Skills (capabilities)</div>
        <div class="item"><div class="dot wounds"></div>Wounds (fractures)</div>
        <div class="item"><div class="dot longings"></div>Longings (deep desires)</div>
        <div class="note">Auto-cycling: attract ↔ scatter</div>
    </div>
</body>
</html>
