<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; color: #0f0; }
        #info h1 { color: #0f0; font-size: 1.2em; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="info"><h1>Cyberspace</h1><p>Matrix-style grid exploration</p></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const grid = new THREE.GridHelper(100, 50, 0x004400, 0x001100);
        scene.add(grid);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 100;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ color: 0x00ff00, size: 0.5, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            particles.rotation.y += 0.002;
            camera.position.x = Math.sin(time) * 30;
            camera.position.z = Math.cos(time) * 30 + 50;
            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
